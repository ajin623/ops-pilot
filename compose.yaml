name: opspilot

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
  image: opspilot-api:local

x-app-environment: &app-environment
  POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
  POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"

x-app-security: &app-security
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"

    ports:
      - "127.0.0.1:${OPSPILOT_DB_PORT:-55432}:5432"

    volumes:
      - opspilot_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  bootstrap:
    <<: [*app-build, *app-security]
    command:
      [
        "python",
        "-m",
        "scripts.bootstrap_database"
      ]
    environment: *app-environment

    volumes:
      - ./data/processed/olist:/app/data/processed/olist:ro

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    <<: [*app-build, *app-security]
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "opspilot_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    environment: *app-environment

    ports:
      - "127.0.0.1:${OPSPILOT_API_PORT:-8000}:8000"

    depends_on:
      bootstrap:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

volumes:
  opspilot_postgres_data:
