name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Environment-free validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Compile Python modules
        run: |
          python -m compileall \
            -q \
            opspilot_api \
            scripts \
            tests

      - name: Run environment-free unit tests
        run: |
          env \
            -u POSTGRES_DB \
            -u POSTGRES_USER \
            -u POSTGRES_PASSWORD \
            -u POSTGRES_HOST \
            -u POSTGRES_PORT \
            python -m unittest \
              discover \
              --start-directory tests \
              --pattern 'test_*_unit.py' \
              --verbose

      - name: Validate container definition
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: ci-only-placeholder
        run: |
          docker compose \
            --file compose.yaml \
            config \
            --quiet

      - name: Build and inspect application image
        run: |
          docker build \
            --file Dockerfile \
            --tag opspilot-api:ci \
            .

          IMAGE_USER="$(
            docker image inspect \
              opspilot-api:ci \
              --format '{{.Config.User}}'
          )"

          test "$IMAGE_USER" = "opspilot"

          docker run \
            --rm \
            --read-only \
            --tmpfs /tmp \
            --entrypoint python \
            opspilot-api:ci \
            -c "from opspilot_api.main import app; assert app.routes"
