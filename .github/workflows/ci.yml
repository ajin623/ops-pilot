name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Environment-free unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Compile Python modules
        run: |
          python -m compileall \
            -q \
            opspilot_api \
            scripts \
            tests

      - name: Run environment-free unit tests
        run: |
          env \
            -u POSTGRES_DB \
            -u POSTGRES_USER \
            -u POSTGRES_PASSWORD \
            -u POSTGRES_HOST \
            -u POSTGRES_PORT \
            python -m unittest \
              discover \
              --start-directory tests \
              --pattern 'test_*_unit.py' \
              --verbose
